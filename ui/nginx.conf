server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 真实 HTTP 请求：ui 容器把 API 反代到 odds 容器
    location /api/ {
        proxy_pass http://odds:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://odds:5000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
